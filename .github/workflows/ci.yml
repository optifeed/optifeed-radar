name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The CLI reads and writes local state (.optifeed/) and resolves paths from
    # HOME and cwd, so path handling has to hold on Windows too - one OS is not
    # enough coverage for a published CLI.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Line endings differ on Windows checkouts; the format gate is a
      # single-platform concern, so run it once rather than six times.
      - run: npm run format:check
        if: matrix.os == 'ubuntu-latest'
      - run: npm test
      - run: npm run build
