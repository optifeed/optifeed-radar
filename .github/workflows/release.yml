name: Release

# Publishing is tag-driven: cut a release by pushing `v<version>` matching
# package.json. Nothing publishes from a branch push, so a merge can never
# ship a version by accident.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the signed attestation linking the
      # tarball to this workflow run and commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # The full gate runs again here: the tarball is built from this tree, not
      # from whatever passed CI on the branch.
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
      - name: Verify the tag matches package.json
        # The ref name goes through the environment, never interpolated into
        # the shell command.
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-tag.mjs "$TAG"
      - name: Review tarball contents
        run: npm pack --dry-run
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
