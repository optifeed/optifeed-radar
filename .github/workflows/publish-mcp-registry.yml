name: Publish to MCP Registry
on: {workflow_dispatch: {}, release: {types: [published]}}
permissions: {contents: read, id-token: write}
jobs: {publish: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-go@v5, with: {go-version: stable}}, {name: Publish to MCP Registry, run: "go install github.com/modelcontextprotocol/registry/cmd/publisher@latest && export PATH=$PATH:$(go env GOPATH)/bin && publisher login github-oidc && publisher publish"}]}}
